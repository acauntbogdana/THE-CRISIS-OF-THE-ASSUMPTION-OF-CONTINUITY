[package]
name = "dataset-report"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dataset-report"
path = "src/main.rs"

[dependencies]
arrow = "53"
anyhow    = "1"
parquet   = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-cast = { version = "53", default-features = false, features = ["prettyprint"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
chrono    = "0.4"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "line_series", "ttf"] }
rand      = "0.8"
ndarray   = "0.15"
statrs   = "0.16"
csv       = "1.1"
rayon     = "1.5"   # NEW: параллельные итераторы
fs2 = "0.4"
chrono-tz = "0.8"
log = "0.4"
env_logger = "0.10"
nalgebra = "0.29"

[dev-dependencies]
tempfile = "3"
